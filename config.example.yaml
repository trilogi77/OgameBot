# ==========================================================================
# OGBot - configuración de ejemplo
# Copia este archivo a config.yaml y ajústalo. La contraseña NO se pone aquí:
# usa variables de entorno OGBOT_USER / OGBOT_PASS.
# ==========================================================================

# --- Servidor / cuenta ---
universe: "Quasi'Stellar"          # nombre del universo
country: "es"
server_url: "https://s272-es.ogame.gameforge.com/"   # AJUSTA a tu servidor real

# --- Parámetros del universo ---
# Con auto_server_params: true (recomendado) el bot los lee solo de serverData.xml al
# arrancar (velocidad, flota, factor de escombros, deut en escombros, bodega de sonda) y
# corrige los de abajo si difieren. Son constantes del servidor: tecleadas a mano mal
# envenenan payback, vuelos, combustible y reciclaje en silencio. Pon false para forzar
# los valores de abajo.
auto_server_params: true
universe_speed: 4.0          # velocidad de economía (auto si auto_server_params)
fleet_speed: 2.0             # velocidad de flotas (auto si auto_server_params)
debris_factor: 0.30          # % de naves destruidas que va a escombros (auto)
debris_includes_deut: false  # (auto: deuteriumInDebris del servidor)
loot_percent: 0.50           # % de recursos saqueables
trade_ratio: [2.5, 1.5, 1.0] # metal:cristal:deuterio

# --- Economía ---
target_mine_ratio_payback_hours: 24   # sube mina si se amortiza en <= X horas (óptimo de arranque)
# Umbral ADAPTATIVO: crece con el nivel medio de minas del planeta
# (umbral = base * (1 + nivel_medio/20), con tope max_mine_payback_hours).
# Sin esto, al pasar de las 24 h (~nivel 19-20) las minas dejaban de subir PARA SIEMPRE y
# el bot solo engordaba almacenes. Pon false para el comportamiento fijo de antes.
adaptive_mine_payback: true
max_mine_payback_hours: 168           # tope duro (1 semana)
keep_resources_buffer: 0.10
enable_fusion_reactor: true
fusion_reactor_solar_offset: 25        # Diferencia de niveles mínima que debe haber entre la planta solar y la de fusión (solar - fusión >= offset) antes de subir la de fusión
max_mine_level: 40
storage_fill_trigger_percent: 0.90     # % de llenado que dispara la subida del almacén
storage_min_capacity_target: 1000000   # capacidad mínima (por recurso) garantizada con prioridad MÁXIMA: mientras el almacén no pueda guardar esto, subirlo manda sobre minas/energía/lab. 0 = desactivar
storage_min_capacity_target_startup: 250000  # objetivo reducido durante el desbloqueo del árbol (evita invertir en almacenes de 1M en el arranque; al terminar vuelve al pleno). 0 = usar siempre el pleno

# --- Investigación ---
# Fase de desbloqueo: seguir el orden óptimo hasta tener TODO el árbol a nivel >=1 (sin
# graviton), subiendo el laboratorio a necesidad. Al completarlo, investigación normal por
# prioridad/pesos. Se autolimita (con todo desbloqueado no hace nada).
research_unlock_all: true
# Prioridad para la fase normal (tras desbloquear todo). Evaluación por coste/peso.
research_priority:
  - astrophysics
  - plasma_tech
  - computer_tech
  - combustion_drive
  - impulse_drive
  - hyperspace_drive
  - espionage_tech
  - weapons_tech
  - shielding_tech
  - armor_tech
  - hyperspace_tech
  - energy_tech
  - laser_tech
  - ion_tech

# Pesos de prioridad (mayor peso = mayor importancia y se sube antes)
# research_weights:
#   astrophysics: 2.0
#   plasma_tech: 1.8
#   computer_tech: 1.5
#   combustion_drive: 1.2
#   impulse_drive: 1.1
#   hyperspace_drive: 1.0
#   espionage_tech: 1.0
#   weapons_tech: 1.0
#   shielding_tech: 1.0
#   armor_tech: 1.0
#   hyperspace_tech: 0.9
#   energy_tech: 0.5
#   laser_tech: 0.5
#   ion_tech: 0.5

# Límites de utilidad máximos (no se suben de forma voluntaria más allá de este nivel)
# research_caps:
#   laser_tech: 12
#   ion_tech: 5
#   energy_tech: 8
#   hyperspace_tech: 15


# --- Farmeo ---
enable_farming: true
only_inactive_targets: true          # MÁS SEGURO: solo inactivos
# OGame OCULTA la flota/defensa del informe si mandas pocas sondas. Antes eso llegaba como
# "sin flota ni defensa" y el bot atacaba a ciegas. Ahora, si el informe viene oculto, el bot
# sube las sondas de ese objetivo (+2 por intento, hasta este tope) y lo re-espía.
espionage_max_probes: 12
avoid_strong_players: true
max_attack_targets_per_cycle: 8
min_loot_value: 50000
max_target_distance_systems: 200
attacker_fleet_template:
  small_cargo: 10
  light_fighter: 0
# Reciclar los escombros de los ataques con combate: los escombros simulados cuentan
# como beneficio en el score, y tras enviar la flota se lanza 1 sonda suicida (muere
# contra la defensa y crea el campo de escombros) para poder despachar los
# recicladores calculados cuanto antes.
farm_recycle_debris: true
# Auto-flota de ataque: ignora attacker_fleet_template y el bot elige la escolta
# militar por simulación (mínimo que gana >=95% con margen) según el hangar y la
# defensa del objetivo; los cargueros se dimensionan al botín.
# OJO: con farm_with_probes=true se atacan SOLO con sondas y esta opción se ignora,
# así que ningún inactivo defendido pasará el filtro de victoria >=95%.
farm_auto_fleet: false

# --- Misiles interplanetarios (IPM) — OPCIONAL, apagado por defecto ---
# Abre granjas de INACTIVOS demasiado defendidas para tu flota (las que el farmeo
# descarta por "Combate arriesgado", victoria <95%). Los misiles destruyen su defensa
# sin arriesgar naves y, como los inactivos no reconstruyen, la granja queda abierta
# para siempre. El bot construye el silo y los misiles por sí mismo, y solo actúa si
# hay un objetivo rentable EN RANGO: misma galaxia y (motor_de_impulso * 5) - 1 sistemas.
enable_missile_attacks: false
missile_min_loot_value: 150000   # botín mínimo para que compense abrirla
missile_max_per_target: 60       # tope de misiles por objetivo (seguridad)
missile_silo_target: 4           # nivel del silo (el IPM requiere 4; cada nivel = 10 slots, IPM = 2)
# Despertar al volver la flota de farmeo para relanzar la ronda (como expediciones)
farming_smart_schedule: true
# Descartar el ataque si el informe muestra actividad reciente (<60 min) en el
# objetivo: en un "inactivo" es señal de trampa o de que moverá los recursos.
farming_skip_active_targets: true
# Blacklist de granjas pobres: tras 3+ raids con botín real medio < min_loot_value,
# no volver a espiarlas/atacarlas durante estos días (0 = desactivado).
farming_blacklist_days: 7
# Deuterio mínimo a conservar por planeta como combustible de emergencia
# (fleetsave/evasión). Farmeo y expediciones no despegan si dejarían el depósito
# por debajo. 0 = sin reserva.
deuterium_reserve: 0

# --- Configuraciones especiales (programas de desarrollo fijos) ---
# Autoidentificación (recomendado ON): el bot decide solo. El planeta PRINCIPAL sigue el
# orden de inicio de servidor (minas/energía/robótica/laboratorio y tecnologías hasta
# Astrofísica 1) mientras le falten pasos; cada COLONIA sigue el orden óptimo de colonia
# (solo edificios) hasta completarlo. Al terminar, economía normal. 1 planeta = inicio de
# servidor; colonias nuevas identificadas por no ser el principal.
special_auto_program: true
# Override manual opcional: coordenadas "g:s:p" de un planeta que forzará el orden de
# colonia. Vacío = ninguno.
special_new_planet: ""
# Flags antiguos (compatibilidad): fuerzan su orden aunque special_auto_program sea false.
special_server_start: false
special_new_planet_auto: false

# Multiplicadores de flota (escalados por el nivel de mina de metal del bot en el modo ofensivo)
fleet_multipliers:
  small_cargo: 5.0
  large_cargo: 6.0
  recycler: 2.5
  light_fighter: 40.0
  heavy_fighter: 20.0
  cruiser: 10.0
  battleship: 5.0
  battlecruiser: 2.4

# --- Expediciones ---
enable_expeditions: true
expedition_position: 16
expedition_ships:
  large_cargo: 1
# Auto-cálculo: el bot calcula cuántos cargueros (NGC) hacen falta para sostener
# el botín máximo de tu universo y reparte los disponibles entre todos los slots
# de expedición para maximizar el número de expediciones (y la rentabilidad).
expedition_auto_ships: false
expedition_cargo_ship: large_cargo   # tipo de carguero a dimensionar
expedition_use_pathfinder: false     # incluir 1 Pathfinder por expedición (x2 botín) si hay
expedition_send_probe: false         # enviar también sonda(s) de espionaje con cada expedición
expedition_probe_count: 1            # nº de sondas por expedición
expedition_discoverer_class: false   # marca true si tienes la clase Descubridor (x1.5 botín)
expedition_top1_points: 0            # puntos del Top-1 del universo (0 = leerlos de la API)
expedition_find_safety: 1.0          # escala del botín objetivo (1.0 = tope exacto)
expedition_min_cargo: 1              # mínimo de cargueros por expedición
expedition_max_cargo: 0              # tope de cargueros por expedición (0 = sin tope)
expedition_hold_hours: 1.0           # horas de permanencia en la posición 16
# Rotación de sistemas para que no se agote siempre el mismo
expedition_rotate_systems: true
expedition_system_range: 15          # +/- sistemas alrededor del tuyo
# Reactivarse al volver/terminar las expediciones para reenviar nuevas
expedition_smart_schedule: true

# --- Memoria de estado ---
# El bot escanea todos los niveles de edificios/investigación/defensas al inicio y
# luego solo lee recursos, cola y naves en vivo cada ciclo (decide "a tiro hecho"
# sin recorrer todas las ramas). Re-escanea todo cada state_resync_hours por si algo
# se desincroniza (p.ej. juego manual).
enable_state_cache: true
state_resync_hours: 6.0

# --- Reciclaje ---
enable_recycling: true
recycling_min_debris: 8000

# --- Lunas (avanzado; lee la nota del README) ---
enable_moon_creation: false
moon_target_debris: 100000
moon_sacrifice_ship: light_fighter

# --- Colonización ---
enable_colonization: true
preferred_colony_positions: [4, 5, 6, 7, 8, 9, 10, 11, 12]
max_colonies: 9
# Zona (aprox.) donde colonizar el siguiente planeta. Si ambos > 0, la búsqueda parte de
# galaxia:sistema y se expande; si 0, se usa la lógica actual (expandir desde el planeta principal).
colony_target_galaxy: 0
colony_target_system: 0

# --- Directivas / misiones ---
# Reclama automáticamente las recompensas de misiones/directivas completadas.
enable_directive_rewards: true
# Renombra una vez cada planeta/colonia con un nombre aleatorio (misiones 5022/5039).
enable_planet_rename: true

# --- Seguridad / humanización ---
enable_fleetsave: true
enable_attack_escape: true
attack_check_interval_min_s: 300   # comprobar ataques cada [min,max] s (aleatorio)
attack_check_interval_max_s: 780   # 5-13 min: evita un patrón fijo de sondeo
enable_spy_watch: true             # avisar por Telegram si te sondean (misión 6 entrante)
spy_watch_cooldown_mins: 30        # no re-avisar del mismo origen dentro de este tiempo
spy_watch_messages: true           # avisar también vía mensajes de contraespionaje en la bandeja
fleetsave_mission: deploy
fleetsave_prefer_moon: true    # preferir destino luna en el fleetsave (no escaneable por phalanx)
fleetsave_warn_phalanx: true   # avisar por Telegram si el fleetsave queda expuesto a phalanx
reserve_fleetsave_slot: true   # reservar hueco(s) para emergencias (evasión/fleetsave). false = early game (sin flota que salvar): libera esos slots para expediciones/farmeo/colonización
keep_free_fleet_slots: 1       # slots reservados para emergencias (evasión/fleetsave); ignorado si reserve_fleetsave_slot=false
allow_last_slot_for_missions: true # reserva "blanda": nunca bloquear el último slot para misiones (necesario para farmear con poca Computación, 1-2 slots). En cuentas grandes no cambia nada
enable_telegram_commands: true # /status /fleetsave /recall /pausa por Telegram (solo tu chat_id)
enable_selector_canary: true   # al arrancar, verifica selectores clave del DOM y avisa si cambió la interfaz
risk_profile: normal           # perfil aplicado desde la GUI: paranoid/normal/aggressive (informativo)
cycle_order: [economy, recycling, expeditions, farming, feed]  # orden de las rondas del ciclo (drag&drop en la GUI)
fleetsave_only_if_hostile: false  # fleetsave nocturno solo si hubo actividad hostil reciente (12 h)
# Barrido nocturno: cada N horas durante el descanso, despierta y vacía (fleetsave)
# los planetas activados, para recoger la flota fabricada de noche. Actívalo por
# planeta en la pestaña "Por Planeta" (así no haces actividad en todos).
enable_night_sweep: false
night_sweep_interval_hours: 2.0
# Guardia nocturna de ataques (OPCIONAL). Durante el descanso despierta cada 25-45 min
# (aleatorio) SOLO para mirar el eventbox: si detecta un ataque, escapa la flota y hace
# panic-build. Sin esto pasan horas ciegas de noche (el mayor riesgo de perder la flota).
# Ponlo en false si prefieres CERO actividad nocturna (menos huella, más riesgo).
enable_night_attack_watch: true
min_action_delay_s: 3
max_action_delay_s: 11
cycle_interval_min_s: 600
cycle_interval_max_s: 1500
active_hours: [8, 24]        # solo "juega" entre las 8:00 y las 24:00 (local)
max_actions_per_hour: 40
headless: true

# --- Estilo de Juego (ofensivo / defensivo) ---
server_playstyle: "defensive"          # "offensive" (prioriza flotas) o "defensive" (prioriza defensas)

# --- Persistencia / seguridad de pruebas ---
state_file: state.json
log_file: ogbot.log
log_level: INFO
dry_run: true                # ⚠️ DÉJALO EN true HASTA QUE LO HAYAS VALIDADO

# --- Notificaciones de Telegram ---
telegram_token: ""               # Token del bot de Telegram obtenido con @BotFather
telegram_chat_id: ""             # Tu chat ID de Telegram obtenido con @userinfobot

# --- Frecuencias de rondas independientes (minutos; 0 o menos = en cada ciclo) ---
economy_run_interval_mins: 0
farming_run_interval_mins: 0
expeditions_run_interval_mins: 0
recycling_run_interval_mins: 0

